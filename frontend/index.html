<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-APP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="weather-card">
        <div class="app-heading">
            <h1>Weather-App</h1>
        </div>
        <p>Made by Jonny and Preston</p>

        <!-- City Search and Enter -->
        <div class="search-container">
            <input type="text" id="cityInput" list="citySuggestions" placeholder="Enter City Name" autocomplete="off">
            <datalist id="citySuggestions"></datalist>
            <button id="searchBtn">Search</button>
            <button id="bookmarkBtn">Bookmark</button>
        </div>
        <p id="searchStatus" class="search-status" role="status" aria-live="polite" hidden></p>
        <p id="locationHelp" class="location-help" hidden>Your current location is being loaded automatically. You do not need to type your city.</p>

        <!-- Fire Status Text -->
        <p id="fireStatusText" class="fire-status-text" style="display: none;"></p>

        <div class="weather-details">
            <div class="weather-copy">
                <h2 id="cityName">--</h2>
                <p id="temperature">-- °F</p>
                <p id="feelsLike">Feels like: -- °F</p>
                <p id="currentWind">Wind: -- mph</p>
                <p id="condition">--</p>
            </div>
        </div>

        <!-- Weekly Forecast Container -->
        <div class="forecast-section">
            <div class="forecast-heading">
                <h3>Forecast</h3>
                <label for="windUnit">Wind units</label>
                <select id="windUnit">
                    <option value="mph">mph</option>
                    <option value="kph">kph</option>
                </select>
            </div>
            <div id="forecastContainer" class="forecast-container"></div>
        </div>

        <!-- Saved Cities Bookmarks Section -->
        <div class="bookmarks-section">
            <h3>Saved Cities</h3>
            <div id="bookmarksContainer" class="bookmarks-container"></div>
        </div>
    </main>
    
    <script src="app.js"></script>
</body>
</html>
